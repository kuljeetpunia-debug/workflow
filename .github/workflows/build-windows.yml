name: Build Rexera Workflow Desktop

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows desktop package
        run: npm run build && npx electron-builder --win nsis zip --x64 --publish never
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Rexera-Workflow-Windows-ZIP
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Rexera-Workflow-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
